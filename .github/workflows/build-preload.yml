name: Build preload APK

# 预载版（预先下载当前集 + 后面 3 集）的打包流程：推送或手动触发都会打一个可安装的 APK，
# 放在这次运行的 Artifacts 里下载。包名 com.hgtv.star.preload，和正式版并存，不会覆盖。
# 旧源码版的预载（已改用 patch-official.yml，以官方新版为底）。只保留手动触发，免得每次上传文件都白跑一次。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HGTV_APPLICATION_ID: com.hgtv.star.preload
      HGTV_APP_LABEL: 红果TV 预载版
      # 版本号拉高，避免应用内更新拿上游正式版来提示（上游包名不同，本来也装不上）。
      HGTV_VERSION_CODE: '90000'
      HGTV_VERSION_NAME: 1.2.4-preload
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: 安装 SDK 组件
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: 固定签名（有 HGTV_PRELOAD_KEYSTORE 这个 secret 时，每次打包签名都相同，可直接覆盖安装）
        env:
          KEYSTORE_B64: ${{ secrets.HGTV_PRELOAD_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::warning::没有设置 HGTV_PRELOAD_KEYSTORE，本次用随机签名（无法覆盖安装旧版）"; exit 0; fi
          mkdir -p ~/.android
          echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          if [ -n "${ANDROID_USER_HOME:-}" ]; then mkdir -p "$ANDROID_USER_HOME"; cp ~/.android/debug.keystore "$ANDROID_USER_HOME/debug.keystore"; fi
          echo "已使用固定签名"
      - name: 单元测试 + 打包
        run: ./android/gradlew -p android :core:test :app:assembleRelease --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: HGTV-preload-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
